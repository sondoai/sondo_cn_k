# Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx3072M"
org.gradle.caching=true
org.gradle.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.native.ignoreDisabledTargets=true
kotlin.apple.xcodeCompatibility.nowarn=true

# Android
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# KSP
ksp.incremental=true

# ---- Sondo ----
# Kuikly 版本（三端渲染器需保持一致：androidApp / iosApp/Podfile / ohosApp/entry/oh-package.json5）
KUIKLY_VERSION=2.30.0
KUIKLY_KOTLIN_VERSION=2.0.21
# 接口环境：local | test | prod
API_ENV=prod
# 是否展示设置页「修改 Token」测试入口
SHOW_TOKEN_EDITOR=false
# App 版本（Android / iOS 分开维护，与参考工程 pubspec.yaml 对齐）
APP_VERSION_NAME_ANDROID=2.3.2
APP_VERSION_CODE_ANDROID=203021
